# Supply-chain hardening (same policy as ../v2).
# Delay installs of freshly published versions so a malicious release has time to
# be caught and unpublished, and never accept weakened trust signals on update.
minimumReleaseAge: 10080
trustPolicy: no-downgrade

# pnpm 11 requires an explicit build-script decision for every dependency that
# ships one (strictDepBuilds). Native binaries Astro needs at build time.
allowBuilds:
  sharp: true
  esbuild: true

# Allowlist for the trust policy. Dev-only transitive dep of @astrojs/check
# (file watcher for `astro check --watch`), published Dec 2024, never shipped in
# the bundle. Trips `no-downgrade` because an earlier release carried provenance
# and this one does not: a known false positive, not a takeover.
trustPolicyExclude:
  - "chokidar@4.0.3"
  # Legacy semver lines pulled in by lighthouse (@lhci/cli), dev-only. Same false
  # positive as above: the old majors predate npm provenance.
  - semver
