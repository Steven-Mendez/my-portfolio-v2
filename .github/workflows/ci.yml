name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Images
        run: pnpm check:images

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      # lighthouserc.json audits the static build in ./dist.
      - name: Lighthouse CI
        run: pnpm exec lhci autorun
